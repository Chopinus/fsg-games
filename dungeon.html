<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dungeon v0.1 – Game Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   STIL – dunkle Pixel-Fantasy-Optik für alle Menüs (DOM-Overlay)
   ===================================================================== */
:root{
  --bg:#0b0910; --panel:#1a1520; --panel2:#241c2c; --line:#3a2e44; --line2:#5a4866;
  --text:#efe6d6; --muted:#a8998a; --gold:#ffd25a; --fire:#ff9a3c; --red:#e2483d; --green:#5fd068;
  --common:#9d9d9d; --rare:#3d8bff; --epic:#b45cff; --legendary:#ff8c1a;
  --font:'Press Start 2P', ui-monospace, monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
#touch,#touch *,#game{touch-action:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%}
#ui,#ui *{overscroll-behavior:none}
#ui .screen{touch-action:none}
#ui input{touch-action:auto}
#app{position:fixed;inset:0;display:grid;place-items:center}
#game{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;overflow:hidden;padding:16px}
/* Menüs werden automatisch so verkleinert, dass alles ohne Scrollen auf den Bildschirm passt */
.fitbox{display:flex;flex-direction:column;align-items:center;transform-origin:top center;width:100%;flex:none}
.screen.clear{pointer-events:none}.screen.clear>*{pointer-events:auto}
.panel{background:var(--panel);border:4px solid var(--line);box-shadow:0 0 0 4px #000,inset 0 0 0 2px #000,0 10px 30px rgba(0,0,0,.6);padding:16px;image-rendering:pixelated}
h1,h2,h3{font-weight:normal;margin:0 0 12px;letter-spacing:1px}
h2{font-size:16px;color:var(--fire);text-shadow:2px 2px 0 #000}
h3{font-size:11px;color:var(--gold)}
.btn{font-family:var(--font);font-size:12px;color:var(--text);background:linear-gradient(#4a3a2a,#2e2318);border:4px solid #000;box-shadow:inset 0 -4px 0 #1a120b,inset 0 4px 0 #6a5238,0 0 0 2px #7a5d3a;padding:12px 16px;cursor:pointer;text-shadow:2px 2px 0 #000;min-width:44px;min-height:44px}
.btn:hover{filter:brightness(1.2)}.btn:active{transform:translateY(2px)}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.btn.big{font-size:14px;padding:16px 22px;width:100%}
.btn.small{font-size:9px;padding:8px 10px;min-height:36px}
.btn.gold{background:linear-gradient(#a8812a,#6a4f14);box-shadow:inset 0 -4px 0 #3e2d08,inset 0 4px 0 #e0b84a,0 0 0 2px #ffd25a}
.btn.red{background:linear-gradient(#8a2a24,#521612);box-shadow:inset 0 -4px 0 #2e0b08,inset 0 4px 0 #c4483d,0 0 0 2px #e2483d}
.btn.green{background:linear-gradient(#2f7a34,#1a4a1e);box-shadow:inset 0 -4px 0 #0c2a0e,inset 0 4px 0 #5fd068,0 0 0 2px #5fd068}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}.gold{color:var(--gold)}
small,.s{font-size:9px;line-height:1.6}
.topbar{width:min(1100px,100%);display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.chip{font-size:10px;background:#000a;border:2px solid var(--line2);padding:8px 10px;display:inline-flex;gap:8px;align-items:center}
.coin{display:inline-block;width:10px;height:10px;background:var(--gold);box-shadow:inset -2px -2px 0 #b8861a,0 0 0 2px #000;border-radius:2px}
/* Lobby */
#lobbyMenu{margin-top:auto;margin-bottom:5vh;width:min(420px,92vw);display:flex;flex-direction:column;gap:10px}
#lobbyMenu .row .btn{flex:1}
/* Inventar & Slots */
.slot{width:56px;height:56px;background:#0d0a12;border:3px solid var(--line);box-shadow:inset 0 0 0 2px #000;position:relative;display:grid;place-items:center;flex:none}
.slot.empty::after{content:attr(data-label);font-size:7px;color:#5a4e60;text-align:center;line-height:1.3;padding:2px}
.slot.over{border-color:var(--gold)}
.slot canvas{width:48px;height:48px;image-rendering:pixelated;pointer-events:none}
.slot .lvl{position:absolute;right:2px;bottom:2px;font-size:8px;color:#fff;text-shadow:1px 1px 0 #000;pointer-events:none}
.slot.sel{outline:3px solid #fff;outline-offset:1px}
.r0{border-color:#6a6a6a}.r1{border-color:var(--rare);box-shadow:inset 0 0 10px #3d8bff66}
.r2{border-color:var(--epic);box-shadow:inset 0 0 12px #b45cff88}.r3{border-color:var(--legendary);box-shadow:inset 0 0 14px #ff8c1aaa;animation:leg 1.6s infinite alternate}
@keyframes leg{to{box-shadow:inset 0 0 22px #ffb84a,0 0 10px #ff8c1a88}}
.invgrid{display:grid;grid-template-columns:repeat(6,56px);gap:6px}
.drag-ghost{position:fixed;pointer-events:none;z-index:99;width:56px;height:56px;opacity:.9;transform:translate(-50%,-50%)}
#tip{position:fixed;z-index:100;pointer-events:none;max-width:280px;background:#0d0a12f2;border:3px solid var(--line2);box-shadow:0 0 0 3px #000;padding:10px;font-size:9px;line-height:1.7;display:none}
#tip.pinned{pointer-events:auto}
#tip .nm{font-size:10px;margin-bottom:6px}
#tip .up{color:var(--green)}#tip .dn{color:var(--red)}
#tip .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
/* Party */
.pslot{width:150px;min-height:190px;background:#0d0a12;border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;position:relative}
.pslot canvas{width:96px;height:96px;image-rendering:pixelated}
.pslot .rdy{font-size:9px;padding:4px 6px;border:2px solid #000}
.rdy.ok{background:#1f5a24;color:#b8ffbe}.rdy.no{background:#5a1f1f;color:#ffbcbc}
.crown{position:absolute;top:6px;left:8px;font-size:12px}
.friend{display:flex;align-items:center;gap:10px;background:#0d0a12;border:2px solid var(--line);padding:6px 8px}
.dot{width:10px;height:10px;border:2px solid #000;flex:none}
.on{background:#5fd068}.off{background:#666}.busy{background:#ffb02e}
/* Ergebnis */
.loot-line{font-size:9px;padding:4px 0;border-bottom:2px dashed #2e2436}
/* Touch-Steuerung im Run */
#touch{position:fixed;inset:0;pointer-events:none;display:none}
#touch.show{display:block}
.tbtn{position:absolute;pointer-events:auto;border-radius:50%;background:#ffffff1a;border:3px solid #ffffff55;color:#fff;font-family:var(--font);font-size:10px;display:grid;place-items:center;text-shadow:1px 1px 0 #000}
.tbtn:active,.tbtn.down{background:#ffffff40}
.tbtn canvas{position:absolute;inset:14%;width:72%;height:72%;image-rendering:pixelated;pointer-events:none}
.tbtn .cd{position:absolute;left:0;right:0;bottom:0;background:#000a;border-radius:0 0 50% 50%;pointer-events:none}
.tbtn .cdt{position:absolute;inset:0;display:grid;place-items:center;font-size:2.4vmin;pointer-events:none;text-shadow:1px 1px 0 #000}
.tbtn .cnt{position:absolute;right:-2px;bottom:-4px;font-size:2vmin;background:#000c;border:2px solid #ffffff55;border-radius:6px;padding:2px 3px;pointer-events:none}
.tbtn.off{opacity:.35}
#stick{position:absolute;left:0;top:0;width:45%;height:100%;pointer-events:auto}
#knob{position:absolute;width:110px;height:110px;border-radius:50%;border:3px solid #ffffff44;display:none}
#knob i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:#ffffff55}
@media (max-width:700px){.invgrid{grid-template-columns:repeat(5,52px)}.slot{width:52px;height:52px}.pslot{width:44vw}}
</style>
</head>
<body>
<div id="app"><canvas id="game" width="960" height="576"></canvas></div>
<div id="ui"></div>
<div id="touch"><div id="stick"><div id="knob"><i></i></div></div></div>
<div id="tip"></div>
<script>
'use strict';
/* =====================================================================
   MODUL 1: KONFIGURATION & HILFSFUNKTIONEN
   ===================================================================== */
const T = 16;                 // Tile-Größe in Spielpixeln
const RW = 20, RH = 12;       // Raumgröße in Tiles (320 x 192 Spielpixel)
const VW = RW * T, VH = RH * T;
const SCALE = 3;              // Spielpixel -> Canvas-Pixel (960 x 576)
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// Begrenzte Palette (Buchstabe -> Farbe) für alle Pixel-Sprites
// Version und ob das Spiel im Game Hub läuft (dann gibt es einen Zurück-Knopf)
const GAME_VERSION = 'v0.1', IN_HUB = /dungeon/i.test(location.pathname) && location.protocol.startsWith('http');
const PAL = {
  k: '#0b0a0f', d: '#1c1a24', g: '#5a5468', l: '#9a94a8', w: '#e8e2d0', W: '#ffffff',
  r: '#9e2a22', R: '#ff4a3a', o: '#e67e22', y: '#f4d03f', Y: '#fff2a0', b: '#7a4a2a', B: '#4a2c18',
  s: '#e0b088', S: '#b07a50', G: '#3c9a46', L: '#8fe05a', u: '#3d6fd6', c: '#6fd6ff', C: '#2a8ab0',
  p: '#6a3a8e', P: '#a46ad6', q: '#3a2448', m: '#c4ccd8', M: '#6c7480', n: '#8a6a3a', t: '#2c6a5a'
};
// Rüstungsklassen-Farben (ersetzen A/a in Rüstungs-Sprites und am Helden)
const ARMOR_COL = {
  none: ['#5a4a3a', '#3e3228'], cloth: ['#7a5aa8', '#4e3a70'], leather: ['#9a6a3a', '#634222'],
  chain: ['#9aa4b4', '#626a78'], plate: ['#d8dee8', '#8892a4']
};

const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const ang = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);
const angDiff = (a, b) => { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return Math.abs(d); };
const uid = () => Math.random().toString(36).slice(2, 10);
const fmt = n => Math.floor(n).toLocaleString('de-DE');
// Seed-Zufall (für reproduzierbare Dungeons)
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function weighted(list, w = x => x.weight, r = Math.random) { let tot = list.reduce((s, x) => s + w(x), 0), v = r() * tot; for (const x of list) { v -= w(x); if (v <= 0) return x; } return list[list.length - 1]; }

/* =====================================================================
   MODUL 2: AUDIO – Chiptune-Soundeffekte per Web Audio API
   ===================================================================== */
const Sound = (() => {
  let ac = null, master = null, vol = 0.5;
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = vol; master.connect(ac.destination); } catch (e) { ac = null; }
  }
  // Einzelner Ton: Rechteck/Dreieck/Sägezahn mit optionalem Tonhöhen-Gleiten
  function tone(f, dur = .1, type = 'square', v = .12, slide = 0, delay = 0) {
    if (!ac || vol <= 0) return;
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.linearRampToValueAtTime(Math.max(30, f + slide), t + dur);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
  }
  // Rauschen (Treffer, Explosionen)
  function noise(dur = .1, v = .15, freq = 2000, delay = 0) {
    if (!ac || vol <= 0) return;
    const t = ac.currentTime + delay, len = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = buf; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = v;
    src.connect(f); f.connect(g); g.connect(master); src.start(t);
  }
  const arp = (notes, step = .07, type = 'square', v = .1) => notes.forEach((n, i) => tone(n, step * 1.6, type, v, 0, i * step));
  const sfx = {
    click: () => tone(720, .05, 'square', .08),
    hover: () => tone(980, .03, 'square', .03),
    swing: () => noise(.06, .06, 5000),
    hit: () => { noise(.07, .2, 1600); tone(150, .07, 'square', .08, -60); },
    crit: () => { noise(.1, .25, 2600); tone(880, .12, 'square', .1, 400); },
    heavy: () => { noise(.18, .3, 700); tone(90, .18, 'sawtooth', .14, -40); },
    shoot: () => tone(1100, .07, 'square', .06, -600),
    magic: () => tone(440, .16, 'triangle', .12, 700),
    hurt: () => { tone(220, .14, 'sawtooth', .14, -140); noise(.06, .12, 1200); },
    coin: () => { tone(988, .05, 'square', .07); tone(1319, .1, 'square', .07, 0, .05); },
    door: () => { tone(110, .25, 'square', .1, -30); noise(.2, .08, 400); },
    unlock: () => arp([392, 523, 659], .06),
    lever: () => { tone(300, .05, 'square', .1); tone(200, .05, 'square', .1, 0, .05); },
    wrong: () => { tone(200, .12, 'square', .12); tone(140, .2, 'square', .12, 0, .12); },
    solve: () => arp([523, 659, 784, 1047], .08, 'square', .1),
    chest: r => arp([[392, 523], [440, 554, 659], [523, 659, 784, 988], [523, 659, 784, 1047, 1319, 1568]][r], .09, 'square', .1),
    fire: () => { noise(.3, .2, 900); tone(160, .3, 'sawtooth', .08, -80); },
    frost: () => { tone(1500, .25, 'triangle', .1, -900); noise(.2, .08, 6000); },
    zap: () => { for (let i = 0; i < 4; i++) tone(rand(600, 1600), .05, 'square', .07, -300, i * .03); },
    heal: () => arp([523, 659, 784, 1047], .06, 'triangle', .12),
    blink: () => tone(1200, .12, 'sine', .12, -900),
    spawn: () => tone(200, .3, 'triangle', .08, 300),
    die: () => { tone(300, .15, 'square', .1, -200); noise(.12, .1, 900); },
    slime: () => tone(180, .1, 'sine', .14, 120),
    roar: () => { tone(90, .6, 'sawtooth', .18, -40); noise(.5, .2, 500); },
    levelup: () => arp([523, 659, 784, 1047, 1319], .07, 'square', .1),
    dodge: () => noise(.08, .06, 3000),
    down: () => arp([392, 330, 262, 196], .12, 'triangle', .12),
    revive: () => arp([262, 330, 392, 523], .1, 'triangle', .12),
    spike: () => { tone(900, .04, 'square', .05); noise(.05, .08, 4000); },
    victory: () => arp([523, 523, 784, 1047, 784, 1047, 1319], .12, 'square', .1),
  };
  return { init, sfx, setVol: v => { vol = v; if (master) master.gain.value = v; }, get vol() { return vol; } };
})();
const sfx = (n, ...a) => { try { Sound.sfx[n] && Sound.sfx[n](...a); } catch (e) {} };

/* =====================================================================
   MODUL 3: PIXEL-SPRITES – alle Grafiken werden aus Zeichen-Rastern erzeugt
   ===================================================================== */
const SPR = {
  hero: ['......HHHH......', '.....HHHHHH.....', '.....HsssHH.....', '.....sksks......', '......ssss......', '....AAAAAAAA....', '...sAAAAAAAAs...', '...sAAaAAaAAs...', '...s.AAAAAA.s...', '.....AAAAAA.....', '.....PPPPPP.....', '.....PP..PP.....', '.....PP..PP.....', '.....PP..PP.....', '....FFF..FFF....'],
  hero2: ['......HHHH......', '.....HHHHHH.....', '.....HsssHH.....', '.....sksks......', '......ssss......', '....AAAAAAAA....', '...sAAAAAAAAs...', '...sAAaAAaAAs...', '...s.AAAAAA.s...', '.....AAAAAA.....', '.....PPPPPP.....', '....PP....PP....', '....PP....PP....', '...FFF....FFF...', '................'],

  skeleton2: ['......wwww......', '.....wwwwww.....', '.....wkwwkw.....', '.....wwwwww.....', '......wkkw......', '.......ww.......', '....wwwwwwww....', '...w..wkkw..w...', '..w...wwww...w..', '......wkkw......', '.......ww.......', '.....w....w.....', '.....w....w.....', '....ww....ww....', '................'],
  slime: ['', '', '', '', '', '......LLLL......', '....LLGGGGLL....', '...LGGGGGGGGL...', '..LGGwkGGwkGGL..', '..LGGkkGGkkGGL..', '..GGGGGGGGGGGG..', '..GGGGGGGGGGGG..', '..tGGGGGGGGGGt..', '...tttttttttt...'],
  slime2: ['', '', '', '', '', '', '', '.....LLLLLL.....', '...LLGGGGGGLL...', '.LGGGwkGGwkGGGL.', '.LGGGkkGGkkGGGL.', 'GGGGGGGGGGGGGGGG', 'tGGGGGGGGGGGGGGt', '.tttttttttttttt.'],
  bat: ['', '', '', 'qq............qq', 'qqq..........qqq', '.qqqq.qqqq.qqqq.', '..qqqqqRRqqqqq..', '...qqqqqqqqqq...', '.....qqqqqq.....', '......q..q......'],
  bat2: ['', '', '', '', '', '......qqqq......', '..qqqqqRRqqqqq..', '.qqqqqqqqqqqqqq.', 'qqq..qqqqqq..qqq', 'qq....q..q....qq'],
  mage: ['.......pp.......', '......pppp......', '.....pppppp.....', '.....pkRRkp.....', '.....pppppp.....', '....pppppppp..c.', '...pppPPPPppp.b.', '...ppPPPPPPpp.b.', '...pppPPPPppp.b.', '....pppppppp..b.', '....pppppppp..b.', '...pppppppppp.b.', '...pppppppppp...', '..pppppppppppp..', '..kk........kk..'],
  mage2: ['.......pp.......', '......pppp......', '.....pppppp.....', '.....pkRRkp.....', '.....pppppp...c.', '....pppppppp..b.', '...pppPPPPppp.b.', '...ppPPPPPPpp.b.', '...pppPPPPppp.b.', '....pppppppp..b.', '....pppppppp..b.', '...pppppppppp...', '...pppppppppp...', '..pppppppppppp..', '...kk......kk...'],
  boss: ['....y.y..y.y....', '....yyyyyyyy....', '....wwwwwwww....', '...wwRwwwwRww...', '...wwwwwwwwww...', '....wkwkwkww....', '.....wwwwww.....', '..rrwwwwwwwwrr..', '.rrww.wkkw.wwrr.', '.rrw..wwww..wrr.', '.rr...wkkw...rr.', '.rr....ww....rr.', '.rr...w..w...rr.', '..r...w..w...r..', '.....ww..ww.....'],
  // Waffen (zeigen nach oben rechts = -45°, außer markiert)
  dagger: ['', '.............m', '............mw', '...........mw', '..........mw', '.........mw', '........mw', '.....y.mw', '......yw', '.....byy', '....bb..y', '...bb'],
  sword: ['..............mw', '.............mwm', '............mwm.', '...........mwm..', '..........mwm...', '.........mwm....', '........mwm.....', '...y...mwm......', '....y.mwm.......', '.....ywm........', '......yy........', '.....b.yy.......', '....b...y.......', '...b............', '..yy............'],
  axe: ['..........mm....', '.........mmwm...', '........mmwwmm..', '.........mbwmm..', '........bb.mm...', '.......bb.......', '......bb........', '.....bb.........', '....bb..........', '...bb...........', '..bb............', '.bb.............'],
  hammer: ['.......MMMMMM...', '......MmmwmmmM..', '......MmmmmmmM..', '.......MMMMMM...', '.........bb.....', '........bb......', '.......bb.......', '......bb........', '.....bb.........', '....bb..........', '...BB...........', '..BB............'],

  staff: ['..........cc....', '.........cWWc...', '.........cWWc...', '..........cc....', '.........b......', '........b.......', '.......b........', '......b.........', '.....b..........', '....b...........', '...b............', '..b.............'],
  helm: ['', '.....AAAAAA.....', '....AaAAAAAA....', '...AAAWAAAAAA...', '...AAAAAAAAAA...', '...AAkkAAkkAA...', '...Aa.kkkk.aA...', '...AA......AA...'],

function sprite(name, map = null, key = '') {
  const id = name + '|' + key;
  if (sprCache.has(id)) return sprCache.get(id);
  const rows = SPR[name], c = document.createElement('canvas'); c.width = 16; c.height = 16;
  const x = c.getContext('2d');
  rows.forEach((row, yy) => { for (let xx = 0; xx < Math.min(16, row.length); xx++) { const ch = row[xx]; if (ch === '.' || ch === ' ') continue; const col = (map && map[ch]) || PAL[ch]; if (!col) continue; x.fillStyle = col; x.fillRect(xx, yy, 1, 1); } });

}

function rollRarity(bonus = 0) {

  return RARITY.indexOf(weighted(RARITY, r => r.weight * (RARITY.indexOf(r) ? 1 + bonus : 1)));

// Gegenstandsstufe (ilvl) 1–20: jede Stufe +12 % Grundwerte
const tierMult = ilvl => 1 + (clamp(ilvl, 1, 20) - 1) * .12;
function makeWeapon(type, rarity, ilvl = 1) {
  ilvl = clamp(Math.round(ilvl), 1, 20); const W = WEAPONS[type], m = RARITY[rarity].mult * tierMult(ilvl);
  const name = adjName(pick(PREFIX[rarity]), pick(WEAPON_NAMES[type])) + (rarity >= 2 ? pick(SUFFIX) : '');
  return { id: uid(), slot: 'weapon', type, rarity, name, up: 0, ilvl,
    stats: { dmg: Math.round(W.dmg * m * rand(.92, 1.08)), crit: +(W.crit + rarity * .02).toFixed(2), speed: W.speed, def: 0, hp: rarity >= 2 ? rint(5, 15) * rarity : 0 } };
}
function makeArmor(slot, cls, rarity, ilvl = 1) {
  ilvl = clamp(Math.round(ilvl), 1, 20); const C = ARMOR_CLASS[cls], S = ARMOR_SLOTS[slot], m = RARITY[rarity].mult * tierMult(ilvl);
  const name = adjName(rarity ? pick(PREFIX[rarity]) : '', C.name + '-' + S.name);

    stats: { def: +(C.def * S.m * m * 2).toFixed(1), speed: +(C.speed * S.m).toFixed(3), hp: Math.round((rarity >= 1 ? rint(2, 6) * rarity : 0) + (ilvl - 1) * 3 * S.m), crit: 0, dmg: 0, mana: C.mana } };

function makeJewel(rarity, ilvl = 1) {
  ilvl = clamp(Math.round(ilvl), 1, 20); const type = Math.random() < .5 ? 'ring' : 'amulet', gem = pick(GEMS), m = RARITY[rarity].mult * (1 + (ilvl - 1) * .06);

function makeArtifact(set, stars, aslot) {

function generateDungeon(level, partySize, stage = 1) {
  // Jede Stage wird größer: Stage 1 = 7–9 Räume auf dem Hauptweg, ab Stage 4 = 13–15

  for (let tries = 0; tries < 800; tries++) {
    const N = grow ? 9 : 7, cells = new Map(), K = (x, y) => x + ',' + y;

      if (!opts.length) { ok = false; break; }
      [x, y] = pick(opts); main.push([x, y]); cells.set(K(x, y), true);
    }
    if (!ok) continue;

function getAt(loc) { const [k, v] = loc.split(':'), d = Profile.data; if (k === 'art') return d.arts[+v] || null; if (k === 'aeq') return d.artEq[v] || null; if (k === 'inv') return d.inv[+v]; if (k === 'eq') return d.equip[v]; if (k === 'hot') return d.hotbar[+v]; if (k === 'shop') return d.shop.items[+v]; return null; }

// Canvas an Fenster anpassen (Seitenverhältnis bleibt, Pixel bleiben scharf)
function resize() {
  const s = Math.min(innerWidth / canvas.width, innerHeight / canvas.height);
  canvas.style.width = Math.floor(canvas.width * s) + 'px'; canvas.style.height = Math.floor(canvas.height * s) + 'px';
}
addEventListener('resize', () => { resize(); if (typeof UI !== 'undefined') UI.fit(); }); resize();
function toGame(cx, cy) { const r = canvas.getBoundingClientRect(); return { x: (cx - r.left) / r.width * VW, y: (cy - r.top) / r.height * VH, sx: (cx - r.left) / r.width * canvas.width, sy: (cy - r.top) / r.height * canvas.height }; }

/* ---------- Tastatur & Maus ---------- */
const KEYMAP = { KeyW: 'u', ArrowUp: 'u', KeyS: 'd', ArrowDown: 'd', KeyA: 'l', ArrowLeft: 'l', KeyD: 'r', ArrowRight: 'r' };

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return; Sound.init();
  if (KEYMAP[e.code]) { Input.keys.add(KEYMAP[e.code]); updateMoveFromKeys(); if (Run.active) e.preventDefault(); if (Input.touch && !Touch.forced()) { Input.touch = false; Touch.update(); } }
  if (!Run.active) return;
  if (e.code === 'Space') { Input.dodge = true; e.preventDefault(); }
  if (e.code === 'KeyE') { if (!Input.interact) Input.interactPressed = true; Input.interact = true; }
  if (e.code >= 'Digit1' && e.code <= 'Digit4') Input.spells[+e.code.slice(5) - 1] = true;
  if (e.code === 'KeyQ') Input.ability = true;
  if (e.code === 'KeyR') Input.potion = true;
  if (e.code === 'Escape' || e.code === 'KeyP') togglePause();
});
addEventListener('keyup', e => { if (KEYMAP[e.code]) { Input.keys.delete(KEYMAP[e.code]); updateMoveFromKeys(); } if (e.code === 'KeyE') Input.interact = false; });
canvas.addEventListener('mousemove', e => { const p = toGame(e.clientX, e.clientY); Input.aimX = p.x; Input.aimY = p.y; });
canvas.addEventListener('mousedown', e => { Sound.init(); if (!Run.active) return; if (e.button === 0) { // Klick auf Hotbar = Zauber
    const p = toGame(e.clientX, e.clientY); const hb = (Run.hotbarRects || []).find(r => p.sx >= r.x && p.sx <= r.x + r.w && p.sy >= r.y && p.sy <= r.y + r.h); if (hb) { hotAct(hb.i); return; } Input.attack = true; }

addEventListener('mouseup', e => { if (e.button === 0) Input.attack = false; });

// Touch: Hotbar-Felder antippen wirkt den Zauber

function hotAct(i) { if (i === 'ab') Input.ability = true; else if (i === 'pot') Input.potion = true; else Input.spells[i] = true; }

let lastTouchEnd = 0;

      b.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); Sound.init(); pid = e.pointerId; x0 = e.clientX; y0 = e.clientY; Object.assign(Input.stick, { on: true, dx: 0, dy: 0, t: 0 }); b.classList.add('down'); knob.style.display = 'block'; knob.style.transform = ''; b.setPointerCapture(pid); });
      b.addEventListener('pointermove', e => { if (e.pointerId !== pid) return; let dx = e.clientX - x0, dy = e.clientY - y0; const l = Math.hypot(dx, dy), m = Math.min(innerWidth, innerHeight) * .09; if (l > m) { dx = dx / l * m; dy = dy / l * m; } Input.stick.dx = dx / m; Input.stick.dy = dy / m; knob.style.transform = `translate(${dx}px,${dy}px)`; });
      const end = e => { if (e.pointerId !== pid) return; pid = null; const S = Input.stick, l = Math.hypot(S.dx, S.dy); if (S.t <= .35 || l > .3) Input.release = { dir: l > .3 ? Math.atan2(S.dy, S.dx) : null }; S.on = false; S.dx = S.dy = 0; b.classList.remove('down'); knob.style.display = 'none'; };
      b.addEventListener('pointerup', end); b.addEventListener('pointercancel', end); this.el.appendChild(b);
    }
    // Alle Aktionen im Bogen um den Angriffsknopf – erreichbar mit dem rechten Daumen (wie Brawl Stars)
    const at = (deg, r, size) => { const a = deg * Math.PI / 180; return `right:${(12.5 - Math.cos(a) * r - size / 2).toFixed(1)}vmin;bottom:${(13.5 + Math.sin(a) * r - size / 2).toFixed(1)}vmin;width:${size}vmin;height:${size}vmin;font-size:${(size * .42).toFixed(1)}vmin`; };
    const withCd = b => { b.insertAdjacentHTML('beforeend', '<i class="cd" style="height:0"></i><span class="cdt"></span>'); return b; };
    mk('💨', at(180, 20, 10.5), () => Input.dodge = true);
    this.abBtn = withCd(mk('✨', at(132, 20, 10.5), () => Input.ability = true));
    mk('✋', at(86, 20, 10.5), () => { Input.interactPressed = true; Input.interact = true; }, () => Input.interact = false);
    // Äußerer Bogen: Zauber 1–4 und Heiltrank
    this.spellBtns = [0, 1, 2, 3].map(i => { const b = withCd(mk('', at(176 - i * 24, 32, 9), () => { Input.spells[i] = true; Run.hotFlash = { i, t: .2 }; })); b.dataset.k = ''; return b; });
    this.potBtn = mk('<span class="cnt"></span>', at(80, 32, 9), () => Input.potion = true);
    this.potBtn.insertAdjacentHTML('afterbegin', '<canvas width="16" height="16"></canvas>'); this.potBtn.querySelector('canvas').getContext('2d').drawImage(sprite('potion'), 0, 0);
    mk('II', 'right:1.5vmin;top:1.5vmin;width:7vmin;height:7vmin;font-size:2.4vmin;border-radius:10px', () => togglePause());
    // Joystick: erscheint dort, wo der Daumen aufsetzt
    const st = document.getElementById('stick'), knob = document.getElementById('knob'), inner = knob.firstElementChild; let id = null, cx = 0, cy = 0;
    st.addEventListener('pointerdown', e => { e.preventDefault(); Sound.init();
      if (tapHotbar(e.clientX, e.clientY)) return; // Hotbar hat Vorrang vor dem Joystick
      id = e.pointerId; cx = e.clientX; cy = e.clientY; knob.style.display = 'block'; knob.style.left = cx - 55 + 'px'; knob.style.top = cy - 55 + 'px'; inner.style.transform = ''; Input.stickActive = true; st.setPointerCapture(id); });
    st.addEventListener('pointermove', e => { if (e.pointerId !== id) return; let dx = e.clientX - cx, dy = e.clientY - cy; const d = Math.hypot(dx, dy), m = 45; if (d > m) { dx = dx / d * m; dy = dy / d * m; } inner.style.transform = `translate(${dx}px,${dy}px)`; Input.move.x = dx / m; Input.move.y = dy / m; if (d < 8) Input.move.x = Input.move.y = 0; });
    const end = e => { if (e.pointerId !== id) return; id = null; knob.style.display = 'none'; Input.move.x = Input.move.y = 0; Input.stickActive = false; };
    st.addEventListener('pointerup', end); st.addEventListener('pointercancel', end);
  },
  // Pro Bild: Zauber-Icons, Abklingzeiten und Trank-Anzahl auf den Touch-Knöpfen aktualisieren
  tick() {
    if (!this.built || !Run.active || !this.el.classList.contains('show')) return; const p = player(); if (!p) return;
    const cdSet = (b, cd, full) => { const f = full > 0 ? clamp(cd / full, 0, 1) : 0; b.querySelector('.cd').style.height = (f * 100).toFixed(0) + '%'; b.querySelector('.cdt').textContent = cd > 0 ? cd.toFixed(cd < 10 ? 1 : 0) : ''; };
    this.spellBtns.forEach((b, i) => { const it = p.hotbar[i], k = it ? it.id : '';
      if (b.dataset.k !== k) { b.dataset.k = k; b.querySelectorAll('canvas').forEach(c => c.remove()); if (it) b.insertAdjacentElement('afterbegin', iconCanvas(it)); b.style.borderColor = it ? RARITY[it.rarity].color : '#ffffff22'; }
      b.style.display = it ? '' : 'none'; if (it) { const st = spellStats(it); cdSet(b, Math.max(0, p.spellCd[i]), st.cd); b.classList.toggle('off', p.mana < st.mana); } });
    this.abBtn.style.display = isUnlocked('ability') ? '' : 'none';
    const A = ABILITIES[p.st.hero]; cdSet(this.abBtn, Math.max(0, p.abCd || 0), A.cd * (1 - Math.min(40, p.st.cdr || 0) / 100));
    this.potBtn.querySelector('.cnt').textContent = '×' + Profile.data.potions; this.potBtn.classList.toggle('off', !Profile.data.potions);
  },
  update() { const on = Run.active && this.enabled(); if (on) this.build(); this.el.classList.toggle('show', on); Input.touch = on || (Run.active && Input.touch); if (!on) Input.touch = false; },
};
// Erste Berührung schaltet im Automatik-Modus auf Touch um
addEventListener('touchstart', () => { if (Profile.data && Profile.data.settings.touch === 'auto' && !Input.touch && Run.active) { Touch.isTouchDevice = true; Touch.update(); } }, { passive: true });

/* ---------- Spielschleife ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  try {
    if (Run.active && Run.room) { if (!Run.paused) updateRun(dt); renderRun(); Touch.tick(); }
    else renderLobby(now / 1000);
    if (window.Freunde && Social.hub) Freunde.setHidden(Run.active && !Run.paused); // 👥 im Run ausblenden
  } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}

/* ---------- Start ---------- */
Profile.load();
Social.connect(meInfo());
Social.on('party', () => { if (!Run.active && UI.cur && (UI.cur[0] === 'party' || UI.cur[0] === 'lobby')) UI.refresh(); });
Social.on('friends', () => { if (!Run.active && UI.cur && UI.cur[0] === 'party') UI.refresh(); });
UI.show('lobby');
requestAnimationFrame(frame);
// Schrift laden, damit Canvas-Texte die Pixel-Schrift nutzen
if (document.fonts && document.fonts.load) document.fonts.load('12px "Press Start 2P"').catch(() => {});
// Für Tests/Debugging von außen erreichbar
window.DG = { Run, Profile, Social, UI, startRun, enterRoom, Input };

</script>
</body>
